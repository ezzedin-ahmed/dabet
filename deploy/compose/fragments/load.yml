# Load-test overlay. Base file first:
#
#   docker compose -f deploy/compose/docker-compose.yml \
#                  -f deploy/compose/fragments/load.yml up -d --build --wait
#
# It changes three things that make the base stack impossible to load
# test meaningfully, and nothing else.
#
# 1. PARTITIONS. The base kafka-init creates every topic with 3
#    partitions; §4.2 targets 512 for messages.v1. Partition count is
#    the hard ceiling on how many moderation-service instances can share
#    the work, so a 3-partition topic caps the system at three consumers
#    however many you run. This overlay raises messages.v1 to
#    LOAD_MESSAGES_PARTITIONS (default 64 — enough to expose partition
#    imbalance and to let several consumers work, without asking a
#    single-broker laptop Kafka to manage 512 logs) and flagged.v1 /
#    deletions.v1 to 16.
#
#    Partition counts can only be increased, never decreased, and
#    increasing them REKEYS the topic: a given key may move to a
#    different partition, which breaks the §7.3 guarantee that one
#    consumer owns all Redis state for a (sender, content) pair for
#    messages already in flight. That is fine for a load run on a
#    throwaway stack and would not be fine in production; `make down`
#    (which removes volumes) between runs keeps it honest.
#
# 2. THE LLM MOCK. tools/mockllm answers instantly, which means the
#    §7.9 batcher and the §7.5 sampler never do anything: batches leave
#    at size 1 on the linger timer and no queue ever forms. The overlay
#    turns on the latency injector (see tools/mockllm/latency.go) with a
#    p50/p99 and a concurrency ceiling that stand in for a real vLLM.
#
# 3. CONSUMERS. moderation-service processes records on ONE goroutine
#    (kafkax.Consumer.Run iterates fetches serially), so a single
#    instance is single-threaded regardless of partition count. The
#    overlay adds two more instances in the same consumer group, which
#    is the only horizontal lever the design offers.
#
# Every value is overridable from the environment so a run can sweep
# them without editing this file.

name: dabet

services:
  # Raise the partition counts. --create --if-not-exists is idempotent;
  # --alter raises an existing topic and is allowed to fail (Kafka
  # refuses to lower a count, and on a fresh volume the create already
  # used the right number).
  kafka-init:
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        MSG_P="${LOAD_MESSAGES_PARTITIONS:-64}"
        OUT_P="${LOAD_OUTPUT_PARTITIONS:-16}"
        USE_P="${LOAD_USAGE_PARTITIONS:-8}"
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$1" --partitions "$$2" \
            --replication-factor 1 --config "retention.ms=$$3"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --alter --topic "$$1" --partitions "$$2" || true
        }
        create messages.v1  "$$MSG_P" 86400000
        create flagged.v1   "$$OUT_P" 604800000
        create deletions.v1 "$$OUT_P" 86400000
        create usage.v1     "$$USE_P" 604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic messages.v1 | head -1
        echo "topics ready for load"

  # A single-broker Kafka with 64+ partitions and a few hundred thousand
  # records a minute wants more heap than the image default.
  kafka:
    environment:
      KAFKA_HEAP_OPTS: ${LOAD_KAFKA_HEAP:--Xms1g -Xmx2g}
      KAFKA_NUM_IO_THREADS: ${LOAD_KAFKA_IO_THREADS:-8}
      KAFKA_NUM_NETWORK_THREADS: ${LOAD_KAFKA_NET_THREADS:-4}
      # A load run produces far more than the 1 MB default request size
      # per batch when zstd-compressing 64 partitions' worth of records.
      KAFKA_MESSAGE_MAX_BYTES: "10485760"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "10485760"

  # Stand in for a real vLLM: ~1 000 ms median (the §4.6 budget), a long
  # tail, and a bounded number of concurrent generations so that offered
  # load past the ceiling queues rather than being served for free.
  mockllm:
    environment:
      MOCKLLM_P50_MS: ${LOAD_LLM_P50_MS:-900}
      MOCKLLM_P99_MS: ${LOAD_LLM_P99_MS:-2500}
      MOCKLLM_MS_PER_MESSAGE: ${LOAD_LLM_MS_PER_MESSAGE:-3}
      MOCKLLM_CONCURRENCY: ${LOAD_LLM_CONCURRENCY:-16}
      MOCKLLM_ERROR_RATE: ${LOAD_LLM_ERROR_RATE:-0}
      MOCKLLM_TIMEOUT_RATE: ${LOAD_LLM_TIMEOUT_RATE:-0}
      MOCKLLM_SEED: ${LOAD_LLM_SEED:-1}

  # Two more consumer-group members. Ports differ because compose
  # publishes them on the host; INSTANCE_ID differs because §7.10 keys
  # the usage idempotency_key by instance and window, and two instances
  # sharing an id would have their usage events deduplicated against
  # each other by the ledger's unique index.
  moderation-service-2:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/moderation-service/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:29092
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://${POSTGRES_USER:-dabet}:${POSTGRES_PASSWORD:-dabet}@postgres:5432/${POSTGRES_DB:-dabet}?sslmode=disable
      MEMCACHED_ADDRS: memcached:11211
      VLLM_ENDPOINT: http://mockllm:8089
      EMBEDDING_ENDPOINT: http://mockembed:8091
      POLICY_ENDPOINT: policy-service:7101
      CREDITS_ENDPOINT: http://credits-service:8080
      INSTANCE_ID: moderation-2
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      policy-service:
        condition: service_healthy
      credits-service:
        condition: service_healthy
      mockllm:
        condition: service_healthy
      mockembed:
        condition: service_healthy
    ports:
      - "8185:8080"
      - "9185:9090"

  moderation-service-3:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/moderation-service/Dockerfile
    environment:
      KAFKA_BROKERS: kafka:29092
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://${POSTGRES_USER:-dabet}:${POSTGRES_PASSWORD:-dabet}@postgres:5432/${POSTGRES_DB:-dabet}?sslmode=disable
      MEMCACHED_ADDRS: memcached:11211
      VLLM_ENDPOINT: http://mockllm:8089
      EMBEDDING_ENDPOINT: http://mockembed:8091
      POLICY_ENDPOINT: policy-service:7101
      CREDITS_ENDPOINT: http://credits-service:8080
      INSTANCE_ID: moderation-3
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      policy-service:
        condition: service_healthy
      credits-service:
        condition: service_healthy
      mockllm:
        condition: service_healthy
      mockembed:
        condition: service_healthy
    ports:
      - "8285:8080"
      - "9285:9090"
