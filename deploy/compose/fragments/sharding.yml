# Connection-sharding overlay (docs §7.2 ASSUMPTION, A13). Base file first:
#
#   docker compose -f deploy/compose/docker-compose.yml \
#                  -f deploy/compose/fragments/sharding.yml up -d --build --wait
#
# It turns on ADAPTER_SHARDING_ENABLED for provider-adapter and adds two
# more adapter instances, which is the only way to see A13 do anything:
# with one instance the ring has one member and every connection is owned
# by it, i.e. the overlay is a no-op until there is a fleet.
#
# WHY THIS IS AN OVERLAY AND NOT THE DEFAULT
#
# Sharding is off in the base stack on purpose. `make e2e` injects a
# message into a connection and asserts it comes out the other end; with
# three adapter instances the connection is watched by whichever one the
# ring picked, but the mock driver's HTTP injection endpoint is per
# container and compose load-balances :8084 across all three, so an
# injection lands on an instance that may not be watching that
# connection. Fixing that is a test-harness concern, not an adapter one.
# The base stack therefore keeps the single-instance behaviour every
# other target depends on, and this overlay is for exercising the
# rebalance itself: scale the adapter up and down and watch
# adapter_shard_connections_owned move on :9084/metrics while
# adapter_ingest_total keeps climbing.
#
# NO NEW INFRASTRUCTURE. The coordinator is a Kafka consumer group, so
# there is nothing to add to the stack — no etcd, no extra container.
# The coordination topic (adapter.shards.v1) carries no records and is
# created by the adapter itself on startup with broker defaults, so
# kafka-init does not need to know about it either.

services:
  provider-adapter:
    environment:
      ADAPTER_SHARDING_ENABLED: "true"
      # The ring node name. It MUST be stable across restarts of the same
      # logical instance: a fresh ID every restart is a fresh ring member
      # every restart, which reshuffles a segment for no reason. Compose
      # gives each container a stable hostname, which is the default when
      # this is unset, but naming it explicitly documents the requirement.
      ADAPTER_INSTANCE_ID: adapter-1
      ADAPTER_CONNSOURCE_POLL: 3s
      # Small enough that a laptop stack can actually hit it; production
      # default is 5000 (§7.2).
      ADAPTER_SHARD_MAX_CONNECTIONS: ${ADAPTER_SHARD_MAX_CONNECTIONS:-5000}

  provider-adapter-2:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/provider-adapter/Dockerfile
    environment: &shard-env
      KAFKA_BROKERS: kafka:29092
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://${POSTGRES_USER:-dabet}:${POSTGRES_PASSWORD:-dabet}@postgres:5432/${POSTGRES_DB:-dabet}?sslmode=disable
      OAUTH_MOCK_TOKEN_URL: http://mockoauth:9099/oauth/token
      OAUTH_MOCK_CLIENT_ID: dabet-local
      OAUTH_MOCK_CLIENT_SECRET: dabet-local-secret
      ADAPTER_CONNSOURCE_POLL: 3s
      ADAPTER_SHARDING_ENABLED: "true"
      ADAPTER_INSTANCE_ID: adapter-2
      ADAPTER_SHARD_MAX_CONNECTIONS: ${ADAPTER_SHARD_MAX_CONNECTIONS:-5000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      user-service:
        condition: service_healthy
    ports:
      - "8184:8080"
      - "9184:9090"

  provider-adapter-3:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: services/provider-adapter/Dockerfile
    environment:
      <<: *shard-env
      ADAPTER_INSTANCE_ID: adapter-3
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      user-service:
        condition: service_healthy
    ports:
      - "8284:8080"
      - "9284:9090"
