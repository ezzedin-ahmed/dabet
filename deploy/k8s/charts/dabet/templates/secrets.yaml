{{/*
§4.4: "Secrets (Postgres password, Stripe key, OAuth client secrets) come
from the environment in v1, from a secret manager in the k8s target."

Three sources, ONE contract. Whichever is enabled, the result is a
Kubernetes Secret named {{ include "dabet.secretName" . }} carrying the keys
listed in values.secrets.data. Workloads reference that name and those keys
and nothing else, so moving from the bare-cluster fallback to AWS Secrets
Manager changes zero bytes of any pod spec.

  secrets.create           plain Secret from values (bare-cluster fallback)
  externalSecrets.enabled  External Secrets Operator syncs it from a manager
  secretsStoreCSI.enabled  Secrets Store CSI driver syncs it from a manager

Enabling a manager and leaving secrets.create=true is a real mistake — the
chart would fight the operator over ownership of the same object — so it is
refused below rather than resolved silently.
*/}}
{{- if and .Values.secrets.create (or .Values.externalSecrets.enabled .Values.secretsStoreCSI.enabled) }}
{{- fail "secrets.create=true together with externalSecrets.enabled or secretsStoreCSI.enabled: both would own the same Secret. Set secrets.create=false when a secret manager fills it." }}
{{- end }}

{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dabet.secretName" . }}
  labels:
    {{- include "dabet.labels" (dict "root" .) | nindent 4 }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- $rs256 := eq (include "dabet.rs256" .) "true" }}
  {{- range $k, $v := .Values.secrets.data }}
  {{- /* The RS256 PEMs are only meaningful under RS256; skip the empty
         placeholders under HS256 so the Secret does not carry two dead keys
         that look like they should contain something. */}}
  {{- if or (not (has $k (list "JWT_PRIVATE_KEY" "JWT_PUBLIC_KEY"))) $rs256 }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- else }}
  {{/* Empty is a legitimate value: MAIL_SMTP_USERNAME="" means anonymous
       SMTP, OAUTH_*_CLIENT_ID="" means that platform is not configured.
       The KEY must still exist, because a secretKeyRef to a missing key
       blocks the pod from starting. */}}
  {{ $k }}: ""
  {{- end }}
  {{- end }}
  {{- end }}
  {{- /* POSTGRES_DSN_* fall back to POSTGRES_DSN when left empty, so §3's
         "separate clusters for identity/policy" is opt-in rather than
         mandatory. Rendered here, not in the workload, so the indirection
         stays in one place. */}}
  {{- $shared := .Values.secrets.data.POSTGRES_DSN }}
  {{- range $key := list "POSTGRES_DSN_IDENTITY" "POSTGRES_DSN_POLICY" "POSTGRES_DSN_BILLING" "POSTGRES_DSN_REVIEW" }}
  {{- if not (index $.Values.secrets.data $key) }}
  {{ $key }}: {{ $shared | quote }}
  {{- end }}
  {{- end }}
{{- end }}

{{- /* httpx.VerifierFromEnv accepts HS256 and RS256 and exits on anything
       else. Catching it here turns a fleet-wide CrashLoopBackOff into a
       failed render. */}}
{{- if not (has (upper .Values.jwt.alg) (list "HS256" "RS256")) }}
{{- fail (printf "jwt.alg must be HS256 or RS256, got %q. Every verifying service exits at startup on any other value (pkg/httpx/auth.go)." .Values.jwt.alg) }}
{{- end }}

{{- if .Values.jwt.alg }}
{{- if and (eq (include "dabet.rs256" .) "true") .Values.secrets.create }}
{{- if not .Values.secrets.data.JWT_PRIVATE_KEY }}
{{- fail "jwt.alg=RS256 requires secrets.data.JWT_PRIVATE_KEY (user-service signs with it). Generate: openssl genrsa -out jwt.key 2048" }}
{{- end }}
{{- if not .Values.secrets.data.JWT_PUBLIC_KEY }}
{{- fail "jwt.alg=RS256 requires secrets.data.JWT_PUBLIC_KEY (every other service verifies with it). Generate: openssl rsa -in jwt.key -pubout -out jwt.pub" }}
{{- end }}
{{- end }}
{{- end }}
