{{/*
One ClusterIP Service per workload, plus a headless Service for the
StatefulSet.

Every image listens on 8080 (app + /healthz + /readyz) and 9090 (Prometheus
/metrics); policy-service adds 7101 for the §6.7 GetPolicy gRPC contract.
The metrics port is on the Service so a ServiceMonitor can select it by NAME
rather than by number — renumbering METRICS_ADDR then does not silently stop
the scrape.
*/}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dabet.svcName" (dict "root" $root "name" $name) }}
  labels:
    {{- include "dabet.labels" (dict "root" $root "name" $name) | nindent 4 }}
  {{- with $root.Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "dabet.selectorLabels" (dict "root" $root "name" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.ports.http }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ $svc.ports.metrics }}
      targetPort: metrics
      protocol: TCP
    {{- range $svc.ports.extra }}
    - name: {{ .name }}
      port: {{ .containerPort }}
      targetPort: {{ .name }}
      protocol: {{ default "TCP" .protocol }}
    {{- end }}
{{- if $svc.headless }}
---
{{/*
Headless companion for the StatefulSet. This is what gives
provider-adapter-0..N-1 stable per-pod DNS
(<pod>.<headless>.<ns>.svc.cluster.local). The A13 ring is keyed on
ADAPTER_INSTANCE_ID = the pod name, and stable names are the whole point of
using a StatefulSet here; the DNS record makes that identity resolvable too.

publishNotReadyAddresses is true so a member that is starting up is still
resolvable — the ring coordinator is a Kafka consumer group and does not
depend on this, but a half-registered member with no DNS is a confusing thing
to debug.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dabet.svcName" (dict "root" $root "name" $name) }}-headless
  labels:
    {{- include "dabet.labels" (dict "root" $root "name" $name) | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "dabet.selectorLabels" (dict "root" $root "name" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.ports.http }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ $svc.ports.metrics }}
      targetPort: metrics
      protocol: TCP
{{- end }}
{{- end }}
{{- end }}
