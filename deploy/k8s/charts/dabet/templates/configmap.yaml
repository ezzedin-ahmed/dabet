{{/*
§4.4 configuration: "Every service reads config from environment variables,
no config files. Names are prefixed by concern, not by service ... so shared
values are literally identical strings across services."

That property is why this is ONE ConfigMap consumed by every pod rather than
nine copies: KAFKA_BROKERS means the same thing everywhere, so it is defined
once. Per-service tunables get their own small ConfigMap below.

NOTHING SECRET GOES IN HERE. POSTGRES_DSN and CLICKHOUSE_DSN carry passwords
and S3_ACCESS_KEY/S3_SECRET_KEY are credentials, so all four live in the
Secret and are wired per service with secretKeyRef. A ConfigMap is readable
by anything with get on the namespace and is dumped verbatim by
`kubectl describe pod`.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dabet.sharedConfigName" . }}
  labels:
    {{- include "dabet.labels" (dict "root" .) | nindent 4 }}
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # -- §4.4 canonical coordinates -------------------------------------------
  KAFKA_BROKERS: {{ .Values.config.kafkaBrokers | quote }}
  REDIS_ADDR: {{ .Values.config.redisAddr | quote }}
  MEMCACHED_ADDRS: {{ .Values.config.memcachedAddrs | quote }}
  VLLM_ENDPOINT: {{ .Values.config.vllmEndpoint | quote }}
  EMBEDDING_ENDPOINT: {{ .Values.config.embeddingEndpoint | quote }}
  MILVUS_ADDR: {{ .Values.config.milvusAddr | quote }}
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}

  # -- the shared runner (pkg/service) --------------------------------------
  # Both are the image defaults; stated so a reader can see that the probe
  # ports and the ServiceMonitor port below are not guesses.
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9090"
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}

  # -- §5.4 token algorithm -------------------------------------------------
  # HS256 by default so a bare install works with nothing but JWT_SECRET.
  # Under RS256 the key material is mounted as files per service; see
  # templates/workloads.yaml.
  JWT_ALG: {{ .Values.jwt.alg | quote }}

  # -- pkg/kafkax consumer tunables -----------------------------------------
  # Every one of these is a documented default, not a constant in code
  # (§4.4). KAFKA_CONSUMER_DRAIN_TIMEOUT is the one with a blast radius
  # outside Kafka: terminationGracePeriodSeconds must exceed it, which
  # _helpers.tpl enforces at render time.
  KAFKA_CONSUMER_PARTITION_CONCURRENCY: {{ .Values.kafka.consumer.partitionConcurrency | quote }}
  KAFKA_CONSUMER_QUEUE_DEPTH: {{ .Values.kafka.consumer.queueDepth | quote }}
  KAFKA_CONSUMER_MAX_POLL_RECORDS: {{ .Values.kafka.consumer.maxPollRecords | quote }}
  KAFKA_CONSUMER_DRAIN_TIMEOUT: {{ printf "%ds" (int .Values.kafka.consumer.drainTimeoutSeconds) | quote }}
  KAFKA_COMMIT_INTERVAL: {{ printf "%ds" (int .Values.kafka.commit.intervalSeconds) | quote }}
  KAFKA_COMMIT_RECORDS: {{ .Values.kafka.commit.records | quote }}
  # kafka_consumer_lag_messages is §4.7's primary overload signal and the
  # input to the KEDA/Prometheus autoscalers below. Setting KAFKA_LAG_INTERVAL
  # to 0 disables sampling entirely and blinds both the alert and the
  # autoscaler.
  KAFKA_LAG_INTERVAL: {{ printf "%ds" (int .Values.kafka.lag.intervalSeconds) | quote }}
  KAFKA_LAG_TIMEOUT: {{ printf "%ds" (int .Values.kafka.lag.timeoutSeconds) | quote }}

  {{- if .Values.tracing.enabled }}
  # -- §4.5 OpenTelemetry ---------------------------------------------------
  # Tracing is off unless OTEL_EXPORTER_OTLP_ENDPOINT is set: pkg/tracing
  # installs the no-op provider and exports nothing. A misconfigured endpoint
  # is a warning, never a startup failure (P2: observability may not take the
  # moderation path down).
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ required "tracing.endpoint is required when tracing.enabled" .Values.tracing.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.tracing.protocol | quote }}
  OTEL_TRACES_SAMPLER: {{ .Values.tracing.sampler | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.tracing.samplerArg | quote }}
  {{- with .Values.tracing.resourceAttributes }}
  OTEL_RESOURCE_ATTRIBUTES: {{ . | quote }}
  {{- end }}
  {{- end }}

  {{- range $k, $v := .Values.config.extra }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{/*
Per-service tunables. Split from the shared map so that changing, say,
MOD_LLM_TIMEOUT rolls only moderation-service: the checksum annotation on
each workload covers its own ConfigMap, not everyone else's.
*/}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $env := default (dict) $svc.env }}
{{- if and (eq $name "insights-service") (default (dict) (index $root.Values.services "clustering-service")).enabled }}
{{/* §8.5: point insights at clustering-service only when it is actually
     deployed. Set-but-empty (the values.yaml default) disables the hop;
     unset would fall back to a localhost default and climb
     fail_open_total{component="clustering"} forever. */}}
{{- $env = merge (dict "CLUSTERING_ENDPOINT" (printf "http://%s:%d" (include "dabet.svcName" (dict "root" $root "name" "clustering-service")) (int (index $root.Values.services "clustering-service").ports.http)) ) $env }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dabet.svcConfigName" (dict "root" $root "name" $name) }}
  labels:
    {{- include "dabet.labels" (dict "root" $root "name" $name) | nindent 4 }}
  {{- with $root.Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- range $k, $v := $env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- if and (eq (include "dabet.rs256" $root) "true") (eq (include "dabet.usesJWT" (dict "root" $root "svc" $svc)) "true") }}
  {{- if eq (default "none" $svc.jwt) "issue" }}
  # §5.4: user-service is the issuer. It reads the PRIVATE key from a file so
  # the PEM never appears in an env var, a process listing, or
  # `kubectl describe pod`. The verifier is derived from the private key's
  # public half, so no JWT_PUBLIC_KEY is needed here.
  JWT_PRIVATE_KEY_FILE: {{ printf "%s/%s" $root.Values.jwt.mountPath $root.Values.jwt.privateKeyFilename | quote }}
  {{- with $root.Values.jwt.kid }}
  JWT_KID: {{ . | quote }}
  {{- end }}
  {{- else }}
  # §5.4: every other service verifies with the issuer's PUBLIC key.
  JWT_PUBLIC_KEY_FILE: {{ printf "%s/%s" $root.Values.jwt.mountPath $root.Values.jwt.publicKeyFilename | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
