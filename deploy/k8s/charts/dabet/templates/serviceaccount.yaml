{{- if .Values.serviceAccount.create }}
{{/*
One ServiceAccount per service, not one for the release.

No Dabet service talks to the Kubernetes API, so this is not about RBAC — it
is the attachment point for cloud identity. On EKS, IRSA (or Pod Identity)
binds an IAM role to a specific ServiceAccount, so per-service accounts are
what let insights-service write to the embeddings bucket without also giving
policy-service that permission. The Terraform agent annotates these; the
annotation key is eks.amazonaws.com/role-arn and it goes in
services.<name>.serviceAccount.annotations. See the chart README.

automountServiceAccountToken defaults to false: the API-server token is a
credential no Dabet pod has any use for. IRSA's projected web identity token
is a separate volume added by the EKS webhook and is unaffected.
*/}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dabet.svcName" (dict "root" $root "name" $name) }}
  labels:
    {{- include "dabet.labels" (dict "root" $root "name" $name) | nindent 4 }}
  {{- $ann := merge (dict) (default (dict) (default (dict) $svc.serviceAccount).annotations) $root.Values.serviceAccount.annotations $root.Values.global.commonAnnotations }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $root.Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
{{- end }}
