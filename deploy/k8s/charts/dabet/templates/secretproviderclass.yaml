{{- if .Values.secretsStoreCSI.enabled }}
{{/*
Secrets Store CSI driver — the alternative to ESO for §4.4's secret manager.

The driver mounts the provider's secret into a pod, and with `secretObjects`
it also materialises a Kubernetes Secret. This chart uses the second half:
the Secret it produces has the same name and keys as every other path, so the
workloads are unchanged.

One caveat worth knowing before choosing this over ESO: the driver only
creates the synced Secret while at least one pod mounts the CSI volume, and
this chart does not mount CSI volumes into the workloads (they consume the
Secret by reference). If you pick this path, either add a CSI volume to one
workload via services.<name>.extraVolumes/extraVolumeMounts, or use ESO,
which reconciles the Secret independently of any pod. ESO is the simpler
choice for this shape of application and is what values-aws.yaml uses.
*/}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "dabet.secretName" . }}
  labels:
    {{- include "dabet.labels" (dict "root" .) | nindent 4 }}
spec:
  provider: {{ .Values.secretsStoreCSI.provider }}
  parameters:
    {{- toYaml (required "secretsStoreCSI.parameters is required when secretsStoreCSI.enabled" .Values.secretsStoreCSI.parameters) | nindent 4 }}
  {{- if .Values.secretsStoreCSI.syncSecret }}
  secretObjects:
    - secretName: {{ include "dabet.secretName" . }}
      type: Opaque
      data:
        {{- range $k, $_ := .Values.secrets.data }}
        - objectName: {{ $k }}
          key: {{ $k }}
        {{- end }}
  {{- end }}
{{- end }}
