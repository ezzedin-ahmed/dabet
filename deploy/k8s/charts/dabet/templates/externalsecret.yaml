{{- if .Values.externalSecrets.enabled }}
{{/*
External Secrets Operator — the §4.4 "secret manager in the k8s target" path.

ESO reconciles a remote secret (AWS Secrets Manager, Vault, GCP SM, ...) into
a Kubernetes Secret. The target name and the key names are EXACTLY the ones
templates/secrets.yaml would have produced, which is what makes this a drop-in
replacement rather than a second configuration surface: the workloads still
reference {{ include "dabet.secretName" . }} by name and key.

Guarded on the values flag, so a cluster without external-secrets.io CRDs
never sees this manifest.

The Terraform half of this owes us a remote secret whose keys are the keys of
values.secrets.data. See the chart README, "The Terraform interface".
*/}}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "dabet.secretName" . }}
  labels:
    {{- include "dabet.labels" (dict "root" .) | nindent 4 }}
  {{- with .Values.global.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.secretStoreRef.name is required when externalSecrets.enabled" .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "dabet.secretName" . }}
    creationPolicy: {{ .Values.externalSecrets.creationPolicy }}
    template:
      type: Opaque
  {{- $from := list }}
  {{- range .Values.externalSecrets.dataFrom }}
  {{- if and .extract .extract.key }}
  {{- $from = append $from . }}
  {{- end }}
  {{- end }}
  {{- if $from }}
  dataFrom:
    {{- toYaml $from | nindent 4 }}
  {{- end }}
  {{- with .Values.externalSecrets.data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if and (not $from) (not .Values.externalSecrets.data) }}
  {{- fail "externalSecrets.enabled is true but neither externalSecrets.dataFrom[].extract.key nor externalSecrets.data is set: the ExternalSecret would sync nothing and every pod would fail to start on a missing secret key." }}
  {{- end }}
{{- end }}
