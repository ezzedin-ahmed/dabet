{{- /*
================================================================================
THE CONNECTION CONTRACT (docs §4.4)

This Secret is the entire public interface of this chart. The app chart reads
it and nothing else; it never learns whether a given dependency is a pod in
this release, an RDS instance, or an MSK cluster.

KEYS — every one is a §4.4 canonical variable name, verbatim:

  KAFKA_BROKERS            comma-separated host:port list
  POSTGRES_DSN_IDENTITY    DSN for the identity cluster  (identity + billing)
  POSTGRES_DSN_POLICY      DSN for the policy   cluster  (policy   + review)
  REDIS_ADDR               host:port, or a comma-separated seed list in cluster mode
  REDIS_CLUSTER            "true" | "false"  (NOT a §4.4 name — see below)
  MEMCACHED_ADDRS          comma-separated host:port list of every pool member
  CLICKHOUSE_DSN           clickhouse://user:pass@host:9000/db
  S3_ENDPOINT              http://host:port, or ABSENT for real AWS S3
  S3_BUCKET / S3_ACCESS_KEY / S3_SECRET_KEY / S3_REGION
  MILVUS_ADDR              host:port
  VLLM_ENDPOINT            http://host:port
  EMBEDDING_ENDPOINT       http://host:port

TWO RULES THE CONSUMING SIDE MUST FOLLOW:

1. POSTGRES_DSN is per-database. Services read the bare name `POSTGRES_DSN`
   (pkg/config), so the app chart maps the right key onto that name:

     env:
       - name: POSTGRES_DSN
         valueFrom:
           secretKeyRef:
             name: {{ .Values.connectionSecret.name }}
             key: POSTGRES_DSN_IDENTITY     # user-service, credits-service,
             optional: true                 # provider-adapter
                                            # POSTGRES_DSN_POLICY for
                                            # policy-service, review-service

2. A KEY MAY BE ABSENT. A component that is neither self-hosted nor
   configured externally publishes nothing at all, rather than an empty
   string that would override a service's own default. Always use
   `optional: true` on the secretKeyRef.

REDIS_CLUSTER is the one key that is not in §4.4. It exists because §4.3's
hash tags make the *keyspace* cluster-ready but the *client* still has to be
constructed as a cluster client. It is a signal, not a connection string.
================================================================================
*/ -}}
{{- /* Value-consistency checks live in _validate.tpl and are invoked from
       here because this file is the one template that always renders. */ -}}
{{- include "dabet-deps.validate" . -}}
{{- $brokers    := include "dabet-deps.kafkaBrokers"      . -}}
{{- $redisAddr  := include "dabet-deps.redisAddr"         . -}}
{{- $memcached  := include "dabet-deps.memcachedAddrs"    . -}}
{{- $chDSN      := include "dabet-deps.clickhouseDSN"     . -}}
{{- $milvus     := include "dabet-deps.milvusAddr"        . -}}
{{- $s3         := include "dabet-deps.s3Endpoint"        . -}}
{{- $vllm       := include "dabet-deps.vllmEndpoint"      . -}}
{{- $embed      := include "dabet-deps.embeddingEndpoint" . -}}
{{- $s3Bucket   := include "dabet-deps.s3Bucket"          . -}}

{{- /* S3 credentials: MinIO's root pair when self-hosted, else whatever
       external.s3 carries (empty when the workload uses IRSA). */ -}}
{{- $s3Key := "" -}}
{{- $s3Secret := "" -}}
{{- if .Values.minio.enabled -}}
{{- $minioSecretName := printf "%s-minio" (include "dabet-deps.fullname" .) -}}
{{- $s3Key = .Values.minio.auth.rootUser -}}
{{- $s3Secret = include "dabet-deps.password" (dict "root" . "secret" $minioSecretName "key" "rootPassword" "given" .Values.minio.auth.rootPassword) -}}
{{- else -}}
{{- $s3Key = .Values.external.s3.accessKey -}}
{{- $s3Secret = .Values.external.s3.secretKey -}}
{{- end -}}

{{- /* Assemble, then drop every empty entry. Absent beats empty. */ -}}
{{- $data := dict -}}
{{- $_ := set $data "KAFKA_BROKERS"     $brokers -}}
{{- $_ := set $data "REDIS_ADDR"        $redisAddr -}}
{{- $_ := set $data "MEMCACHED_ADDRS"   $memcached -}}
{{- $_ := set $data "CLICKHOUSE_DSN"    $chDSN -}}
{{- $_ := set $data "MILVUS_ADDR"       $milvus -}}
{{- $_ := set $data "S3_ENDPOINT"       $s3 -}}
{{- $_ := set $data "S3_BUCKET"         $s3Bucket -}}
{{- $_ := set $data "S3_ACCESS_KEY"     $s3Key -}}
{{- $_ := set $data "S3_SECRET_KEY"     $s3Secret -}}
{{- $_ := set $data "S3_REGION"         .Values.external.s3.region -}}
{{- $_ := set $data "VLLM_ENDPOINT"     $vllm -}}
{{- $_ := set $data "EMBEDDING_ENDPOINT" $embed -}}
{{- range $name, $_inst := .Values.postgres.instances -}}
{{- $dsn := include "dabet-deps.postgresDSN" (dict "root" $ "name" $name) -}}
{{- $_ := set $data (printf "POSTGRES_DSN_%s" ($name | upper | replace "-" "_")) $dsn -}}
{{- end -}}
{{- /* REDIS_CLUSTER is meaningful only when there is a Redis at all. */ -}}
{{- if $redisAddr -}}
{{- $_ := set $data "REDIS_CLUSTER" (include "dabet-deps.redisCluster" .) -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.connectionSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dabet-deps.componentLabels" (dict "root" . "component" "connection") | nindent 4 }}
  annotations:
    dabet.io/contract: "docs-4.4"
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- if .Values.connectionSecret.configMap.enabled }}
---
{{/* The same contract, credential-free, for humans and for tooling that
     cannot read Secrets. Anything whose value embeds a password is
     replaced by its host:port so it is still useful for debugging. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.connectionSecret.configMap.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dabet-deps.componentLabels" (dict "root" . "component" "connection") | nindent 4 }}
  annotations:
    dabet.io/contract: "docs-4.4"
    dabet.io/note: "credential-free view of Secret/{{ .Values.connectionSecret.name }}; DSNs and keys are omitted"
data:
  {{- range $k, $v := $data }}
  {{- if and $v (not (or (hasSuffix "_DSN" $k) (hasPrefix "POSTGRES_DSN" $k) (eq $k "S3_ACCESS_KEY") (eq $k "S3_SECRET_KEY"))) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- /* Host:port only, so the ConfigMap still answers "where is it?". */}}
  {{- range $name, $_inst := $.Values.postgres.instances }}
  {{- if and $.Values.postgres.enabled $_inst.enabled (not (index $.Values.external.postgres $name)) }}
  POSTGRES_HOST_{{ $name | upper | replace "-" "_" }}: "{{ include "dabet-deps.componentName" (dict "root" $ "component" (printf "postgres-%s" $name)) }}.{{ $.Release.Namespace }}.svc.{{ include "dabet-deps.clusterDomain" $ }}:5432"
  POSTGRES_DB_{{ $name | upper | replace "-" "_" }}: {{ $_inst.database | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.clickhouse.enabled }}
  CLICKHOUSE_HOST: "{{ include "dabet-deps.componentName" (dict "root" . "component" "clickhouse") }}.{{ .Release.Namespace }}.svc.{{ include "dabet-deps.clusterDomain" . }}:{{ .Values.clickhouse.ports.native }}"
  CLICKHOUSE_DB: {{ .Values.clickhouse.auth.database | quote }}
  {{- end }}
{{- end }}
