{{- if and .Values.memcached.enabled (gt (.Values.memcached.replicas | int) 1) }}
---
{{/*
  Memcached holds no durable state, so this is not about data. It is about
  the §6.8 hit rate: MEMCACHED_ADDRS is a client-sharded list, so every
  node drained is a fraction of the policy cache cold, and every miss is a
  policy-service round trip on the moderation path.
*/ -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "dabet-deps.componentName" (dict "root" . "component" "memcached") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dabet-deps.componentLabels" (dict "root" . "component" "memcached") | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "dabet-deps.selectorLabels" (dict "root" . "component" "memcached") | nindent 6 }}
{{- end }}

