{{- $bootstrap := include "dabet-deps.kafkaAdminBootstrap" . -}}
{{- if and .Values.kafka.topics.enabled $bootstrap -}}
{{- $rf := include "dabet-deps.kafkaTopicRF" . | int -}}
{{- /*
  ============================================================================
  §4.2 TOPIC REGISTRY RECONCILER

  The partition counts and retentions in values.kafka.topics.registry are the
  §4.2 contract. This job makes the cluster match them and can be run any
  number of times.

  IT IS NOT GATED ON kafka.enabled. That gate was the bug: with MSK the
  chart's own broker is off, `auto.create.topics.enable` is false on the
  managed cluster, and the result was a deployment that installed cleanly and
  then failed every produce with UNKNOWN_TOPIC_OR_PARTITION. What this Job
  needs is a broker address, not a broker StatefulSet — so the condition is
  "we know where a broker is", which is exactly what
  dabet-deps.kafkaAdminBootstrap answers, resolving external.kafka.brokers
  first and the in-cluster StatefulSet second. When neither exists the Job
  does not render, so the "everything disabled" release still comes up as two
  objects.

  Idempotence has three separate cases, and getting any of them wrong is
  quietly destructive:

    * topic absent          -> create with the exact partition count and config
    * partitions too low    -> `--alter --partitions N`, which Kafka allows
    * partitions too high   -> REFUSE. Lowering means delete-and-recreate,
                               which drops every record and, for messages.v1,
                               resets the partition assignment that the whole
                               ordering guarantee depends on. The job logs it
                               and carries on rather than failing the release,
                               because the running cluster is not broken — it
                               just has more partitions than the values say.
    * config drift          -> `kafka-configs.sh --alter`, always applied,
                               since retention is cheap to change and is the
                               §4.8 retention story in practice.

  The script lives in the shared kafka-admin ConfigMap; see
  templates/kafka/admin-configmap.yaml.
  ============================================================================
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dabet-deps.componentName" (dict "root" . "component" "kafka-topics") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dabet-deps.componentLabels" (dict "root" . "component" "kafka-topics") | nindent 4 }}
  annotations:
    # Runs on every install AND every upgrade, so the registry is reconciled
    # whenever the values change. `before-hook-creation` deletes the previous
    # Job first, which is what makes a re-run possible at all — a Job's
    # podTemplate is immutable, so an in-place update would be rejected.
    #
    # Weight 0 puts it after the ACL reconciler (-2), which matters on a
    # cluster where the admin credential's own CreateTopic right is itself an
    # ACL: the grant has to exist before the create is attempted.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.kafka.topics.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.kafka.topics.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "dabet-deps.selectorLabels" (dict "root" . "component" "kafka-topics") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- include "dabet-deps.imagePullSecrets" . | nindent 6 }}
      {{- include "dabet-deps.scheduling" (dict "root" . "nodeSelector" (.Values.kafka.admin.nodeSelector | default .Values.kafka.nodeSelector) "tolerations" (.Values.kafka.admin.tolerations | default .Values.kafka.tolerations)) | nindent 6 }}
      {{- with .Values.kafka.admin.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: topics
          image: {{ include "dabet-deps.kafkaAdminImage" . }}
          imagePullPolicy: {{ include "dabet-deps.kafkaAdminImagePullPolicy" . }}
          command: ["/bin/bash", "/spec/reconcile.sh"]
          {{- with .Values.kafka.admin.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "dabet-deps.kafkaAdminEnv" . | nindent 12 }}
            - name: KAFKA_RF
              value: {{ $rf | quote }}
            - name: KAFKA_WAIT_ATTEMPTS
              value: {{ .Values.kafka.admin.waitAttempts | quote }}
            - name: KAFKA_WAIT_INTERVAL
              value: {{ .Values.kafka.admin.waitIntervalSeconds | quote }}
          volumeMounts:
            {{- include "dabet-deps.kafkaAdminVolumeMounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.kafka.admin.resources | nindent 12 }}
      volumes:
        {{- include "dabet-deps.kafkaAdminVolumes" . | nindent 8 }}
{{- end }}
