name: CI

# Fast feedback for every push and PR. Everything here is hermetic: no Docker
# daemon services, no network beyond the module proxy and the image registry.
# The end-to-end suite lives in e2e.yml because it needs the Compose stack.
on:
  push:
  pull_request:

# Read-only. Nothing in this workflow publishes anything.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  # `go build ./...` at the workspace root does not traverse the modules
  # reliably, so every Go job here iterates modules explicitly -- exactly what
  # the Makefile does. go.work is the single source of truth for that list, so
  # read it once and fan the result out as two matrices.
  discover:
    name: discover modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.list.outputs.modules }}
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: list
        run: |
          set -euo pipefail
          modules=$(go work edit -json | jq -c '[.Use[].DiskPath]')
          services=$(go work edit -json | jq -c \
            '[.Use[].DiskPath | select(startswith("./services/")) | ltrimstr("./services/")]')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "modules: $modules"
          echo "services: $services"

  # Deliberately NOT a matrix: gofmt has to see the whole tree in one place
  # (a per-module matrix would miss any .go file added outside a module), and
  # `go vet` over twelve small modules on one warm runner costs far less than
  # twelve runner start-ups.
  lint:
    name: lint (gofmt + vet)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go${{ env.GO_VERSION }}-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go${{ env.GO_VERSION }}-lint-

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::the following files are not gofmt-formatted; run 'gofmt -w' on them"
            echo "$unformatted" | while read -r f; do
              echo "::error file=$f::not gofmt-formatted"
            done
            echo
            echo "--- diff ---"
            gofmt -d .
            exit 1
          fi
          echo "all files are gofmt-formatted"

      - name: go vet (every module)
        run: |
          set -euo pipefail
          rc=0
          for m in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            echo "::group::go vet $m"
            (cd "$m" && go vet ./...) || rc=1
            echo "::endgroup::"
          done
          exit $rc

  # Race and non-race share one job per module rather than splitting into two.
  # The unit suites are seconds long (the slowest module is ~3s locally), so
  # the dominant cost is checkout + toolchain + cache restore -- splitting
  # would roughly double the wall clock to save nothing, and it would double
  # the number of red X's for a single broken module.
  build-test:
    name: build & test (${{ matrix.module }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go${{ env.GO_VERSION }}-buildtest-${{ matrix.module }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go${{ env.GO_VERSION }}-buildtest-${{ matrix.module }}-
            ${{ runner.os }}-go${{ env.GO_VERSION }}-buildtest-

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test -count=1 ./...

      # The race detector uses a separate build cache namespace, so this pass
      # recompiles rather than reusing the one above; it is still cheap here.
      - name: go test -race
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  # The workspace masks missing require/replace/go.sum entries: go.work
  # resolves dabet/pkg for every module whether or not the module itself says
  # how. The container builds set GOWORK=off, so they do not get that help --
  # this job reproduces exactly that condition and has caught a real break
  # before. Keep it independent of build-test.
  standalone-build:
    name: standalone GOWORK=off (${{ matrix.service }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go${{ env.GO_VERSION }}-standalone-${{ matrix.service }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go${{ env.GO_VERSION }}-standalone-${{ matrix.service }}-
            ${{ runner.os }}-go${{ env.GO_VERSION }}-standalone-

      - name: confirm the workspace really is disabled
        run: |
          set -euo pipefail
          test "$(go env GOWORK)" = "off" || { echo "GOWORK is '$(go env GOWORK)', expected off"; exit 1; }

      # `go mod download` on its own surfaces a missing go.sum entry with a
      # clearer message than the build would.
      - name: go mod download
        working-directory: services/${{ matrix.service }}
        run: go mod download

      - name: go build
        working-directory: services/${{ matrix.service }}
        run: go build ./...

  # Build every service image the way compose and a release would: context is
  # the REPOSITORY ROOT, because each module carries
  # `replace dabet/pkg => ../../pkg` and needs pkg/ beside it. Nothing is
  # pushed; a successful build is the whole assertion.
  docker-build:
    name: docker build (${{ matrix.service }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          load: false
          tags: dabet/${{ matrix.service }}:ci
          # Per-service scope: one shared scope would have nine jobs evicting
          # each other's layers on every run.
          cache-from: type=gha,scope=img-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=img-${{ matrix.service }}

  # Single required check for branch protection: the matrices change shape
  # whenever go.work does, and required-check names cannot follow that.
  ci:
    name: ci
    if: always()
    needs: [lint, build-test, standalone-build, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: verify all jobs succeeded
        run: |
          set -euo pipefail
          results='${{ join(needs.*.result, ",") }}'
          echo "upstream results: $results"
          # `skipped` counts as a failure: no job here is skipped by design, so
          # a skip means an upstream job (discover) blew up.
          case "$results" in
            *failure*|*cancelled*|*skipped*)
              echo "::error::a required CI job did not succeed"; exit 1 ;;
          esac
          echo "all CI jobs succeeded"
