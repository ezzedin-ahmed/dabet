name: E2E

# `make up && make e2e` builds eleven images and waits for every healthcheck in
# the Compose stack (Postgres, Kafka, Redis, Memcached, ClickHouse, MinIO, four
# mocks, seven services) before driving one ordered scenario across them. On a
# cold GitHub cache that is many minutes of image building for a suite that
# exercises wiring rather than logic -- and ci.yml already proves every module
# compiles, tests, vets, builds standalone with GOWORK=off, and produces a
# working image. So this does NOT run on every PR:
#
#   * push to main    -- main must never be silently broken
#   * nightly         -- catches drift in base images and third-party deps
#   * `e2e` PR label  -- opt-in for the PRs that touch wiring, per README
#                        ("changes that touch the wiring should also pass
#                        make up && make e2e")
#   * workflow_dispatch -- on demand
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, labeled, synchronize, reopened]
  schedule:
    # 03:17 UTC, off the hour to avoid the scheduler's peak.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: compose stack + e2e suite
    # For pull_request, run only when the `e2e` label is present. Other event
    # types always run.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    # Generous: cold-cache image builds dominate, and `make up --wait` blocks
    # on every healthcheck.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # `make e2e` runs `go test -tags e2e` on the HOST against the published
      # compose ports, so the runner needs the toolchain too.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go1.26-e2e-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go1.26-e2e-

      # Deliberately NO docker/setup-buildx-action here: it installs a
      # docker-container builder whose images do not land in the local daemon,
      # which is exactly what `docker compose up --build --wait` then needs.
      # The runner's stock Docker already has BuildKit on, so the Dockerfiles'
      # `RUN --mount=type=cache` works as-is.

      - name: free runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      # The default profile only (no etcd/Milvus): that is what `make e2e`
      # needs, and Milvus alone wants several GB.
      - name: make up
        timeout-minutes: 45
        run: make up

      - name: docker compose ps
        run: docker compose -f deploy/compose/docker-compose.yml ps -a

      - name: make e2e
        timeout-minutes: 25
        run: make e2e

      # Must run BEFORE `make down` -- that removes the containers and their
      # logs with them. Compose logs are by far the most useful artifact when
      # a wiring test fails.
      - name: collect compose logs
        if: ${{ failure() }}
        run: |
          set -uo pipefail
          mkdir -p compose-diagnostics
          docker compose -f deploy/compose/docker-compose.yml --profile clustering \
            logs --no-color --timestamps --tail=all > compose-diagnostics/compose-logs.txt 2>&1 || true
          docker compose -f deploy/compose/docker-compose.yml --profile clustering \
            ps -a > compose-diagnostics/compose-ps.txt 2>&1 || true
          docker images > compose-diagnostics/docker-images.txt 2>&1 || true
          wc -l compose-diagnostics/*

      - name: upload compose logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: compose-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: compose-diagnostics/
          retention-days: 14
          if-no-files-found: warn

      # Always, so a cancelled or failed run never leaves the runner (or a
      # self-hosted one) holding volumes.
      - name: make down
        if: ${{ always() }}
        run: make down
